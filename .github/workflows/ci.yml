name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si se sube otro commit a la misma rama, se cancela la ejecucion anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pruebas y build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar las pruebas unitarias
        run: npx ng test --watch=false

      - name: Pruebas de los scripts de despliegue
        run: npm run test:scripts

      - name: Build de produccion
        run: npx ng build

  e2e:
    name: Pruebas end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Solo Chromium: el proyecto "movil" tambien lo usa (Pixel 7), asi que no hace falta mas.
      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      # Usan el backend simulado de e2e/api-falso.ts: no levantan Spring ni Django.
      - name: Ejecutar las pruebas end-to-end
        run: npx playwright test

      - name: Guardar las trazas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trazas-e2e
          path: test-results/
          retention-days: 7
