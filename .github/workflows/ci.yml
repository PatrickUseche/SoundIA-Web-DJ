name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si se sube otro commit a la misma rama, se cancela la ejecucion anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pruebas y build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar las pruebas unitarias
        run: npx ng test --watch=false

      - name: Build de produccion
        run: npx ng build
