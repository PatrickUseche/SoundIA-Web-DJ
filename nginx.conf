# Sirve la aplicacion Angular ya compilada (renderizado en el cliente).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;

    # El build genera index.csr.html (y no index.html): es el respaldo de todas las rutas de la SPA,
    # asi /dj o /dashboard funcionan al recargar la pagina.
    location / {
        try_files $uri /index.csr.html;
    }

    # Los archivos js/css llevan un hash en el nombre: se pueden cachear para siempre.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # El HTML nunca se cachea: asi una version nueva se ve en el siguiente acceso.
    location = /index.csr.html {
        add_header Cache-Control "no-cache";
    }
}
