# Sirve la aplicacion Angular ya compilada (renderizado en el cliente).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Subir pistas: el API acepta hasta 55 MB por peticion.
    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Todo sale del mismo origen (el API va por /api); el audio se decodifica desde blobs. Sin scripts de terceros,
    # porque el token vive en sessionStorage. 'unsafe-inline' en estilos lo necesita Angular.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # API Gateway (servicio "api" del docker-compose). Sin bufer para que el stream SSE llegue al instante.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 10m;
    }

    # El build genera index.csr.html (y no index.html): es el respaldo de todas las rutas de la SPA,
    # asi /dj o /dashboard funcionan al recargar la pagina.
    location / {
        try_files $uri /index.csr.html;
    }

    # Los archivos js/css llevan un hash en el nombre: se pueden cachear para siempre.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # El HTML nunca se cachea: asi una version nueva se ve en el siguiente acceso.
    location = /index.csr.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }
}
