<nav class="principal" aria-label="Principal">
  <span class="marca">SoundIA</span>
  <a routerLink="/dj" routerLinkActive="activo" ariaCurrentWhenActive="page">DJ</a>
  <a routerLink="/grabaciones" routerLinkActive="activo" ariaCurrentWhenActive="page">Grabaciones</a>
  <a routerLink="/dashboard" routerLinkActive="activo" ariaCurrentWhenActive="page">Telemetria</a>
  @if (auth.enabled() && auth.authenticated()) {
    <button type="button" class="cerrar-sesion" (click)="cerrarSesion()">Cerrar sesion</button>
  }
</nav>
@if (aviso.slow()) {
  <p class="aviso-despertando" role="status">
    Esto esta tardando mas de lo normal. Si los servidores estaban dormidos (plan gratuito), pueden tardar hasta un
    minuto o dos en despertar. No cierres la pagina.
  </p>
}
<main class="contenido">
  <router-outlet></router-outlet>
</main>
