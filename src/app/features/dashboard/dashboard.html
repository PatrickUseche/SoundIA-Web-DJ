<div style="padding: 20px; font-family: sans-serif;">
    <h2>Panel de Telemetria DJ AI</h2>
    <button (click)="simularMezclaAutomatica()" style="padding: 10px; cursor: pointer;">
        Disparar Evento MIDI
    </button>

    <!-- Bloque condicional: Solo se renderiza si Django responde -->
     <div *ngIf="ultimaDecision" style="margin-top: 20px; padding: 15px; border: 2px solid #4caf50;">
        <h3>Decision del Motor IA (Django)</h3>
        <p><strong>Estado:</strong> {{ultimaDecision}}</p>
        <p><strong>Accion Ejecutada:</strong>{{ultimaDecision.action}}</p>
     </div>

     <h3>Historial en PostgreSQL (Via Spring Boot)</h3>
     <ul>
        <!-- El pipe 'async' se suscribe y destruye automaticamente la conexion. -->
         <li *ngFor="let log of logs$ | async">
            <strong>Control:</strong> {{ log.controlId }} |
            <strong>Valor:</strong> {{ log.value }} |
            <strong>Fecha:</strong> {{ log.createdIn || log.createdAt }}
         </li>
     </ul>
</div>
