@if (mixer.supported) {
    <div class="consola">
        <div class="lado">
            <app-deck deckId="A" />
        </div>

        <section aria-label="Mezclador" class="panel mezclador">
            <h3>Mezclador</h3>
            <label>
                Crossfader (A &#8596; B)
                <input type="range" class="crossfader" min="0" max="1" step="0.01" [value]="mixer.crossfader()"
                    (input)="alMoverCrossfader($event)" aria-label="Crossfader" />
            </label>
            <button type="button" (click)="centrarCrossfader()">Centrar</button>

            <label>
                Volumen maestro
                <input type="range" min="0" max="1" step="0.01" [value]="mixer.masterVolume()"
                    (input)="alMoverVolumenMaestro($event)" aria-label="Volumen maestro" />
            </label>
        </section>

        <div class="lado">
            <app-deck deckId="B" />
        </div>
    </div>
} @else {
    <p role="alert" class="alerta">
        Este navegador no soporta Web Audio, asi que no se pueden reproducir pistas. Usa Chrome, Edge o Firefox.
    </p>
}
