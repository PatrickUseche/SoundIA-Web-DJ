@if (mixer.supported) {
    <div class="consola" style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start;">
        <div style="flex: 1 1 320px;">
            <app-deck deckId="A" />
        </div>

        <section aria-label="Mezclador" style="flex: 0 0 200px; padding: 12px; border: 1px solid #999; margin: 8px 0;">
            <h3>Mezclador</h3>
            <label>
                Crossfader (A &#8596; B)
                <input type="range" min="0" max="1" step="0.01" [value]="mixer.crossfader()"
                    (input)="alMoverCrossfader($event)" aria-label="Crossfader" />
            </label>
            <button type="button" (click)="centrarCrossfader()">Centrar</button>

            <label>
                Volumen maestro
                <input type="range" min="0" max="1" step="0.01" [value]="mixer.masterVolume()"
                    (input)="alMoverVolumenMaestro($event)" aria-label="Volumen maestro" />
            </label>
        </section>

        <div style="flex: 1 1 320px;">
            <app-deck deckId="B" />
        </div>
    </div>
} @else {
    <p role="alert" style="color: #c62828;">
        Este navegador no soporta Web Audio, asi que no se pueden reproducir pistas. Usa Chrome, Edge o Firefox.
    </p>
}
