@if (mixer.supported) {
    <div class="consola">
        <div class="lado">
            <app-deck deckId="A" />
        </div>

        <section aria-label="Mezclador" class="panel mezclador">
            <h3>Mezclador</h3>

            <div class="canales">
                <app-channel-strip deckId="A" />

                <div class="maestro">
                    <app-knob etiqueta="Volumen maestro" etiquetaVisible="Vol" [valor]="mixer.masterVolume()" [reposo]="1"
                        (cambio)="mixer.setMasterVolume($event)" />
                    <app-level-meter etiqueta="Nivel de salida" [nivel]="nivelMaestro()" [segmentos]="20" />
                    <span class="etiqueta">Master</span>
                </div>

                <app-channel-strip deckId="B" />
            </div>

            <div class="crossfader-bloque">
                <label class="crossfader-etiqueta">
                    <span class="cf-lados"><span class="cf-a">A</span> Crossfader <span class="cf-b">B</span></span>
                    <input type="range" class="crossfader" min="0" max="1" step="0.01" [value]="mixer.crossfader()"
                        (input)="alMoverCrossfader($event)" aria-label="Crossfader" />
                </label>
                <button type="button" (click)="centrarCrossfader()">Centrar</button>
            </div>
        </section>

        <div class="lado">
            <app-deck deckId="B" />
        </div>
    </div>
} @else {
    <p role="alert" class="alerta">
        Este navegador no soporta Web Audio, así que no se pueden reproducir pistas. Usa Chrome, Edge o Firefox.
    </p>
}
