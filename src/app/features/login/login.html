<section aria-labelledby="titulo-login" class="panel login">
    <h2 id="titulo-login">Iniciar sesión</h2>
    <form (submit)="onSubmit($event)" novalidate>
        <label for="login-usuario">Usuario</label>
        <input id="login-usuario" name="usuario" type="text" autocomplete="username" maxlength="200" required
            [value]="username()" (input)="onType('username', $event)" />

        <label for="login-contrasena">Contraseña</label>
        <input id="login-contrasena" name="contrasena" type="password" autocomplete="current-password" maxlength="200"
            required [value]="password()" (input)="onType('password', $event)" />

        @if (error(); as messageText) {
            <p role="alert" class="alerta login-error">{{ messageText }}</p>
        }

        <button type="submit" [disabled]="isSending() || !username() || !password()">
            {{ isSending() ? 'Entrando...' : 'Entrar' }}
        </button>
    </form>
</section>
