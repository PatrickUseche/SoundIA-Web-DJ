<section aria-labelledby="titulo-login" class="panel login">
    <h2 id="titulo-login">Iniciar sesion</h2>
    <form (submit)="alEnviar($event)" novalidate>
        <label for="login-usuario">Usuario</label>
        <input id="login-usuario" name="usuario" type="text" autocomplete="username" maxlength="200" required
            [value]="username()" (input)="alEscribir('username', $event)" />

        <label for="login-contrasena">Contrasena</label>
        <input id="login-contrasena" name="contrasena" type="password" autocomplete="current-password" maxlength="200"
            required [value]="password()" (input)="alEscribir('password', $event)" />

        @if (error(); as mensaje) {
            <p role="alert" class="alerta login-error">{{ mensaje }}</p>
        }

        <button type="submit" [disabled]="enviando() || !username() || !password()">
            {{ enviando() ? 'Entrando...' : 'Entrar' }}
        </button>
    </form>
</section>
