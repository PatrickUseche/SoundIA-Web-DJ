<div class="medidor" role="meter" [attr.aria-label]="labelText()" aria-valuemin="0" aria-valuemax="100"
    [attr.aria-valuenow]="percentage()">
    @for (segment of itemList(); track $index) {
        <span class="segmento" [class.encendido]="segment.lit" [attr.data-zona]="segment.zone"
            aria-hidden="true"></span>
    }
</div>
